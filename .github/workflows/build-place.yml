name: Build Roblox place

# Builds the complete LastFlight.rbxl and publishes it as a downloadable artifact.
#   rojo build  -> scripts only
#   bake        -> runs the game's own map builders + remote setup and saves the airplane,
#                  lobby, spawn and RemoteEvents inside the place (visible in Studio Edit mode)
#   verify      -> fails the job unless the game content is actually inside the file
# The .rbxl is never committed to the repository.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/last-flight-roblox-game-cg9vuk

permissions:
  contents: read

jobs:
  build-place:
    name: Build LastFlight.rbxl
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ROJO_VERSION: 7.4.4
      LUNE_VERSION: 0.10.4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rojo ${{ env.ROJO_VERSION }} and Lune ${{ env.LUNE_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 4 --retry-delay 2 -o rojo.zip \
            "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip"
          curl -fsSL --retry 4 --retry-delay 2 -o lune.zip \
            "https://github.com/lune-org/lune/releases/download/v${LUNE_VERSION}/lune-${LUNE_VERSION}-linux-x86_64.zip"
          unzip -o rojo.zip -d "$RUNNER_TEMP/bin"
          unzip -o lune.zip -d "$RUNNER_TEMP/bin"
          rm rojo.zip lune.zip
          chmod +x "$RUNNER_TEMP/bin/rojo" "$RUNNER_TEMP/bin/lune"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          rojo --version
          lune --version

      - name: Build scripts with Rojo
        run: |
          mkdir -p build
          rojo build default.project.json -o build/LastFlight.rojo.rbxl

      - name: Bake world, map and remotes into the place
        run: lune run tools/bake-place build/LastFlight.rojo.rbxl LastFlight.rbxl

      - name: Verify LastFlight.rbxl contains the game
        run: |
          set -euo pipefail
          lune run tools/verify-place LastFlight.rbxl | tee verify.txt
          size=$(stat -c %s LastFlight.rbxl)
          {
            echo "### LastFlight.rbxl built ($size bytes)"
            echo '```'
            cat verify.txt
            echo '```'
            echo "Download it from the **LastFlight-Roblox-Place** artifact below."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastFlight-Roblox-Place
          path: LastFlight.rbxl
          if-no-files-found: error
          retention-days: 30
